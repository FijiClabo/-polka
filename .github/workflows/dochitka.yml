# Дочитка: проверка каждого изменения.
# Тесты, линтер и сборка мини-приложения — на каждый пуш. Сервер сам раз в 5 минут смотрит ветку и забирает
# новую версию, только если эта проверка («Тесты и сборка») прошла (scripts/autoupdate.sh) — секреты не нужны.
name: Дочитка — проверка

on:
  push:
    branches: [claude/telegram-book-app-ip11fm]
    paths: ["dochitka/**", ".github/workflows/dochitka.yml"]
  pull_request:
    paths: ["dochitka/**", ".github/workflows/dochitka.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dochitka-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dochitka
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dochitka/requirements*.txt

      - name: Зависимости
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install -q -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: python -m pytest -q -p no:cacheprovider

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dochitka/webapp/package-lock.json

      - name: Мини-приложение
        working-directory: dochitka/webapp
        run: npm ci --no-audit --no-fund && npm run build
