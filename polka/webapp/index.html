<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee6" />
    <title>Дочитка</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='6' width='6' height='20' rx='2' fill='%23E2B84F'/%3E%3Crect x='13' y='3' width='6' height='23' rx='2' fill='%237E9C7A'/%3E%3Crect x='21' y='8' width='6' height='18' rx='2' fill='%23C9644F'/%3E%3C/svg%3E" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body{margin:0;background:#f3eee6}
      @media (prefers-color-scheme: dark){html,body{background:#1d1a17}}
      #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
      #boot i{width:10px;height:28px;border-radius:3px;margin:0 3px;display:inline-block;animation:b 1s infinite ease-in-out}
      #boot i:nth-child(1){background:#E2B84F}#boot i:nth-child(2){background:#7E9C7A;animation-delay:.15s}#boot i:nth-child(3){background:#C9644F;animation-delay:.3s}
      @keyframes b{0%,100%{transform:scaleY(.6);opacity:.6}50%{transform:scaleY(1);opacity:1}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><i></i><i></i><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
